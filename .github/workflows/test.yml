name: Test & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Build & test (Docker, node:${{ matrix.node-version }}-alpine)
        run: |
          docker build \
            --build-arg NODE_VERSION=${{ matrix.node-version }} \
            --target validator \
            -t underworld-writer:validator-${{ matrix.node-version }} \
            .
