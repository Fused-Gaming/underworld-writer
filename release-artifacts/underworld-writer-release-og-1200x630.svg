<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Underworld Writer v2.2.1 release changelog artwork</title>
  <desc id="desc">Approved Neon Underworld composition with changelog-driven release metadata overlays.</desc>
  <image x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" href="underworld-writer-release-og-1200x630.png"/>
  <g id="underworld-writer-release-data">
    <rect x="60" y="295" width="132" height="34" rx="4" fill="#080910"/>
    <text x="67" y="323" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#FF31C4">v2.2.1</text>
    <g data-release-card="1"><rect x="41" y="452" width="168" height="92" fill="#070A12"/><text x="57" y="477" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#F7F7FA">SEGMENT-FIRST</text><text x="57" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">Podcast &amp; article</text><text x="57" y="521" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">pipelines</text></g>
    <g data-release-card="2"><rect x="231" y="452" width="168" height="92" fill="#070A12"/><text x="247" y="477" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#F7F7FA">VOICE READY</text><text x="247" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">Scripts, timing &amp;</text><text x="247" y="521" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">production docs</text></g>
    <g data-release-card="3"><rect x="421" y="452" width="168" height="92" fill="#070A12"/><text x="437" y="477" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#F7F7FA">ROCK-HARDENED</text><text x="437" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">Validated releases &amp;</text><text x="437" y="521" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">changelog art</text></g>
    <g data-release-card="4"><rect x="611" y="452" width="168" height="92" fill="#070A12"/><text x="627" y="477" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#F7F7FA">OPEN SOURCE</text><text x="627" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">Build. Audit. Improve.</text><text x="627" y="521" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">Together.</text></g>
    <g data-release-card="5"><rect x="801" y="452" width="168" height="92" fill="#070A12"/><text x="817" y="477" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#F7F7FA">REAL IMPACT</text><text x="817" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">Fiction, true-crime, and</text><text x="817" y="521" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">investigative stories.</text></g>
    <g data-release-card="6"><rect x="991" y="452" width="168" height="92" fill="#070A12"/><text x="1007" y="477" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#F7F7FA">BUILT FOR MORE</text><text x="1007" y="503" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">Episodes. Series. A more</text><text x="1007" y="521" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#D5D7DF">transparent tomorrow.</text></g>
    <g transform="translate(924 566)"><rect width="224" height="30" rx="15" fill="#05050a" fill-opacity="0.78" stroke="#ff2abf" stroke-opacity="0.42"/><circle cx="17" cy="15" r="4" fill="#ff2abf"/><text x="31" y="20" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#d7d9e0">CHANGELOG / v2.2.1</text></g>
  </g>
</svg>
