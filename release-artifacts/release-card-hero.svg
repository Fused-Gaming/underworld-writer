<text x="64" y="241" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff">Cross-agent workspace contract</text>
<text x="64" y="270" font-family="Arial" font-size="13" fill="#c2c5ce">Claude, ChatGPT, Copilot, Codex, and future</text>
<text x="64" y="289" font-family="Arial" font-size="13" fill="#c2c5ce">agents share one canonical output structure.</text>
<text x="64" y="308" font-family="Arial" font-size="13" fill="#c2c5ce">Series, season, episode schemas and scaffolding</text>
<text x="64" y="327" font-family="Arial" font-size="13" fill="#c2c5ce">prevent competing generated-output roots.</text>
<rect x="507.5" y="210" width="443.5" height="225" rx="8" fill="#0d0f15" stroke="#454954"/>
<text x="525.5" y="241" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff">Rock-Hardened release evidence</text>
<text x="525.5" y="270" font-family="Arial" font-size="13" fill="#c2c5ce">Release validation now includes changelog</text>
<text x="525.5" y="289" font-family="Arial" font-size="13" fill="#c2c5ce">validation, workspace fixtures, benchmarks, and</text>
<text x="525.5" y="308" font-family="Arial" font-size="13" fill="#c2c5ce">deterministic release assets.</text>
<text x="525.5" y="327" font-family="Arial" font-size="13" fill="#c2c5ce">Voice-generation architecture is reusable at</text>
<text x="525.5" y="346" font-family="Arial" font-size="13" fill="#c2c5ce">project production scope instead of episode</text>
<text x="525.5" y="365" font-family="Arial" font-size="13" fill="#c2c5ce">scope.</text>
<rect x="969" y="210" width="443.5" height="225" rx="8" fill="#0d0f15" stroke="#454954"/>
<text x="987" y="241" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff">Runtime and article validation</text>
<text x="987" y="270" font-family="Arial" font-size="13" fill="#c2c5ce">Episode 1 validates at 4,092 scripted words and</text>
<text x="987" y="289" font-family="Arial" font-size="13" fill="#c2c5ce">29.52 minutes including the 90-second mid-roll.</text>
<text x="987" y="308" font-family="Arial" font-size="13" fill="#c2c5ce">The LinkedIn article validates at 1,864 words</text>
<text x="987" y="327" font-family="Arial" font-size="13" fill="#c2c5ce">against its configured target range.</text>
<rect x="1430.5" y="210" width="443.5" height="225" rx="8" fill="#0d0f15" stroke="#454954"/>
<text x="1448.5" y="241" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff">Segment-first editorial packages</text>
<text x="1448.5" y="270" font-family="Arial" font-size="13" fill="#c2c5ce">Podcast and article outputs now render from one</text>
<text x="1448.5" y="289" font-family="Arial" font-size="13" fill="#c2c5ce">shared evidence and claim package.</text>
<text x="1448.5" y="308" font-family="Arial" font-size="13" fill="#c2c5ce">Episode 1 ships 13 independently recordable</text>
<text x="1448.5" y="327" font-family="Arial" font-size="13" fill="#c2c5ce">podcast segments and reusable editorial blocks.</text>
