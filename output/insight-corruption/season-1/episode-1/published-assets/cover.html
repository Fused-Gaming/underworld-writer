<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Insight Corruption — S1E01 Cover</title>
<style>
  /* 1600x900 render target (16:9) — screenshot this at that viewport size
     to produce the episode's cover art / video thumbnail. */
  @font-face {
    font-family: system-ui;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 1600px;
    height: 900px;
    background: #0b0d12;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .cover {
    width: 1600px;
    height: 900px;
    position: relative;
    background: radial-gradient(circle at 30% 20%, #1a2333 0%, #0b0d12 60%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 120px;
    box-sizing: border-box;
    color: #f4f4f2;
  }
  .kicker {
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #c9a24b;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .title {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.1;
    max-width: 1200px;
    margin: 0 0 32px 0;
  }
  .subtitle {
    font-size: 30px;
    color: #a9b0bd;
    max-width: 1000px;
  }
  .footer {
    position: absolute;
    bottom: 60px;
    left: 120px;
    right: 120px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 24px;
    color: #6b7280;
  }
  .brand {
    color: #c9a24b;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="kicker">Season 1 &middot; Episode 1</div>
    <h1 class="title">Union Boss Smuggled 17,000 Opioid Pills, Faced Zero Jail Time</h1>
    <p class="subtitle">How did an opioid smuggling case result in probation instead of prison?</p>
    <div class="footer">
      <span class="brand">INSIGHT CORRUPTION</span>
      <span>Bay Area Government Corruption Podcast</span>
    </div>
  </div>
</body>
</html>
